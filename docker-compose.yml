services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/app.db
      BETTER_AUTH_URL: http://localhost:3000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - app-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  app-data:
